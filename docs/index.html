<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>충청 카드 재고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#fffdf8; --ink:#1d1b16; --muted:#6f6a5e; --line:#e4dfd2;
  --accent:#e8453c; --accent-ink:#fff; --ok:#1f8a4c; --ok-bg:#e3f4ea; --zero:#9a9486; --warn:#b26a00; --warn-bg:#fff2dc;
  --gs25:#1569d6; --cu:#7a3fc2; --seveneleven:#e0632a; --emart24:#c99a00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --card:#1f1d17; --ink:#f1ede2; --muted:#a39d8d; --line:#34312a;
    --ok:#53c784; --ok-bg:#183326; --zero:#77715f; --warn:#f0b046; --warn-bg:#3a2c12;
    --gs25:#5a9bff; --cu:#b58cf0; --seveneleven:#ff9461; --emart24:#ffd146;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --card:#1f1d17; --ink:#f1ede2; --muted:#a39d8d; --line:#34312a;
  --ok:#53c784; --ok-bg:#183326; --zero:#77715f; --warn:#f0b046; --warn-bg:#3a2c12;
  --gs25:#5a9bff; --cu:#b58cf0; --seveneleven:#ff9461; --emart24:#ffd146;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:18px}
h1{margin:0;font-weight:900;font-size:clamp(26px,6vw,40px);letter-spacing:-.03em;line-height:1.1}
h1 small{display:block;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-bottom:6px}
.meta{font-size:13px;color:var(--muted);text-align:right}
.meta b{color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.demo{margin:16px 0 0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:500}
.regions{display:flex;gap:0;margin:22px 0 0;border-bottom:1px solid var(--line)}
.rtab{font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px;display:flex;gap:6px;align-items:baseline}
.rtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rtab .n{font-size:13px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--ink)}
.rtab .n.hot{background:var(--ok-bg);color:var(--ok)}
.rtab .off{font-size:11px;font-weight:500;color:var(--zero)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:22px 0}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sum .k{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .v{font-size:30px;font-weight:900;letter-spacing:-.02em}
.sum .v span{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 18px}
.tab{font:inherit;font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{margin-left:auto;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
section.kw{margin-bottom:28px}
section.kw h2{font-size:18px;margin:0 0 10px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
section.kw h2 .cnt{font-size:13px;font-weight:500;color:var(--muted)}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;flex:none}
.prod{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{padding:10px 14px;font-size:13px;color:var(--warn);background:var(--warn-bg)}
.empty{padding:12px 14px;font-size:14px;color:var(--muted)}
ul.stores{list-style:none;margin:0;padding:0}
ul.stores li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line)}
ul.stores li:first-child{border-top:0}
.sname{font-weight:700;font-size:15px}
.sname a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.addr{grid-column:1;font-size:12.5px;color:var(--muted)}
.qty{grid-row:1/3;grid-column:2;align-self:center;font-weight:900;font-size:18px;padding:4px 10px;border-radius:8px;text-align:center;min-width:56px}
.qty.ok{background:var(--ok-bg);color:var(--ok)}
.qty.zero{color:var(--zero);font-weight:500;font-size:14px}
h3{font-size:16px;margin:36px 0 10px}
.events{background:var(--card);border:1px solid var(--line);border-radius:14px;list-style:none;margin:0;padding:0}
.events li{padding:9px 14px;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
.events li:first-child{border-top:0}
.events time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.in{color:var(--ok);font-weight:700}.out{color:var(--zero);font-weight:700}
footer{margin-top:40px;font-size:12px;color:var(--muted)}
footer a{color:inherit}
.stat{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:500}
.st.bad{background:var(--warn-bg);color:var(--warn)}
.items{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.item{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-weight:500}
.item b{font-weight:900;margin-left:4px}
details.watch{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.watch summary{cursor:pointer;padding:11px 14px;font-size:14px;display:flex;gap:10px;align-items:center;list-style:none}
details.watch summary::-webkit-details-marker{display:none}
details.watch summary .meta2{color:var(--muted);margin-left:auto;font-size:13px;text-align:right}
details.watch ul{list-style:none;margin:0;padding:0 14px 10px}
details.watch li{font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}
details.watch li span:last-child{color:var(--muted);flex:none}
details.watch li.bad span:last-child{color:var(--warn)}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1}
@media (max-width:560px){.meta{text-align:left}.btns{justify-content:flex-start}.toggle{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>공주 · 청주 편의점</small>포켓몬카드 재고</h1>
    <div class="meta">
      <div>마지막 확인 <b id="checked">–</b></div>
      <div class="btns">
        <a class="btn primary" id="runLink" target="_blank" rel="noopener">지금 확인하기</a>
        <a class="btn" id="editLink" target="_blank" rel="noopener">설정 편집</a>
      </div>
    </div>
  </header>
  <div class="demo" id="demo" hidden>status.json을 불러오지 못해 <b>예시 데이터</b>를 보여주고 있어요. GitHub Actions가 한 번 실행되면 실제 재고가 표시됩니다.</div>

  <nav class="regions" id="regions"></nav>
  <div class="summary" id="summary"></div>

  <div class="controls" id="tabs">
    <button class="tab" data-chain="all" aria-pressed="true">전체</button>
    <button class="tab" data-chain="gs25" aria-pressed="false">GS25</button>
    <button class="tab" data-chain="cu" aria-pressed="false">CU</button>
    <button class="tab" data-chain="seveneleven" aria-pressed="false">세븐일레븐</button>
    <button class="tab" data-chain="emart24" aria-pressed="false">이마트24</button>
  </div>

  <h3 style="margin-top:8px">재고 있는 매장</h3>
  <div id="list"></div>

  <h3>편의점별 감시 현황</h3>
  <div id="watch"></div>

  <h3>최근 입고·품절 기록</h3>
  <ul class="events" id="events"></ul>

  <footer>앱 재고조회 데이터는 실제 진열 재고와 다를 수 있어요. 방문 전 매장에 전화로 확인하세요. 데이터 경로: <a href="https://github.com/hmmhmmhm/daiso-mcp" target="_blank" rel="noopener">daiso-mcp</a> 공개 API.</footer>
</div>

<script>
const DEMO = {
  regions:[{id:"gongju",name:"공주",notify:true},{id:"cheongju",name:"청주",notify:false}],
  chains:[{id:"gs25",label:"GS25",products:2,error:null},{id:"cu",label:"CU",products:2,error:null},{id:"seveneleven",label:"세븐일레븐",products:0,error:"(예시) 조회 실패"},{id:"emart24",label:"이마트24",products:1,error:null}],
  minQuantity:1, checkedAt:new Date().toISOString(),
  groups:[
    {region:"gongju",chain:"gs25",chainLabel:"GS25",productId:"g1",product:"(예시) 포켓몬카드 확장팩 A",checkedStores:12,stores:[{code:"s1",name:"GS25 공주예시점",address:"충남 공주시 예시로 1",phone:"041-000-0000",qty:4,mapUrl:"#"}]},
    {region:"gongju",chain:"gs25",chainLabel:"GS25",productId:"g2",product:"(예시) 포켓몬카드 확장팩 B",checkedStores:12,stores:[{code:"s1",name:"GS25 공주예시점",address:"충남 공주시 예시로 1",phone:"041-000-0000",qty:2,mapUrl:"#"}]},
    {region:"gongju",chain:"cu",chainLabel:"CU",productId:"c1",product:"(예시) 포켓몬)카드팩",checkedStores:17,stores:[]},
    {region:"gongju",chain:"cu",chainLabel:"CU",productId:"c2",product:"(예시) 포켓몬)스타터덱",checkedStores:0,error:"(예시) 조회 실패",stores:[]},
    {region:"cheongju",chain:"cu",chainLabel:"CU",productId:"c1",product:"(예시) 포켓몬)카드팩",checkedStores:91,stores:[]}
  ],
  events:[{at:new Date().toISOString(),type:"restock",region:"gongju",chain:"gs25",chainLabel:"GS25",store:"GS25 공주예시점",product:"(예시) 포켓몬카드 확장팩 A",qty:4,before:0}]
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => { const d = new Date(iso); return isNaN(d) ? "–" : d.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Seoul"}); };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "방금" : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m/60)}시간 전` : `${Math.round(m/1440)}일 전`; };
const CHAINS = ["gs25","cu","seveneleven","emart24"];

let data = null, chain = "all", region = null;
try { chain = localStorage.getItem("chain") || "all"; region = localStorage.getItem("region"); } catch (e) {}
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function repoLinks(){
  const h = location.hostname, seg = location.pathname.split("/").filter(Boolean);
  if (h.endsWith(".github.io") && seg.length) {
    const repo = `https://github.com/${h.split(".")[0]}/${seg[0]}`;
    $("#runLink").href = `${repo}/actions/workflows/check.yml`;
    $("#editLink").href = `${repo}/edit/main/config.json`;
  } else { $("#runLink").style.display = $("#editLink").style.display = "none"; }
}

// 지역의 재고 있는 매장: 매장 단위로 묶고 카드팩 목록을 붙인다
function hotStores(rid, ch){
  const map = new Map();
  for (const g of data.groups) {
    if (g.region !== rid || (ch !== "all" && g.chain !== ch)) continue;
    for (const s of g.stores) {
      if ((s.qty||0) < (data.minQuantity||1)) continue;
      const k = g.chain + "|" + (s.code || s.name);
      if (!map.has(k)) map.set(k, {chain:g.chain, chainLabel:g.chainLabel, store:s, items:[]});
      map.get(k).items.push({name:g.product, qty:s.qty});
    }
  }
  return [...map.values()].sort((a,b) => b.items.reduce((x,i)=>x+i.qty,0) - a.items.reduce((x,i)=>x+i.qty,0));
}

function render(){
  const regions = data.regions || [];
  if (!regions.some(r => r.id === region)) region = regions[0]?.id;
  $("#checked").textContent = `${fmt(data.checkedAt)} (${ago(data.checkedAt)})`;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.chain === chain));

  $("#regions").innerHTML = regions.map(r => { const n = hotStores(r.id, "all").length;
    return `<button class="rtab" data-region="${esc(r.id)}" aria-selected="${r.id === region}">${esc(r.name)}<span class="n ${n ? "hot" : ""}">${n}</span>${r.notify === false ? '<span class="off">알림 꺼짐</span>' : ""}</button>`; }).join("");
  document.querySelectorAll(".rtab").forEach(b => b.onclick = () => { region = b.dataset.region; save("region", region); render(); });

  const G = data.groups.filter(g => g.region === region);
  const hot = hotStores(region, chain);
  const allHot = hotStores(region, "all");
  const nProducts = (data.chains || []).reduce((a, c) => a + (c.products||0), 0);
  const chainState = CHAINS.map(c => {
    const gs = G.filter(g => g.chain === c);
    const meta = (data.chains || []).find(x => x.id === c) || {};
    const ok = gs.filter(g => !g.error && !g.pending).length;
    const label = meta.label || c;
    if (!gs.length) return `<span class="st bad">${esc(label)} 상품 못 찾음</span>`;
    return ok ? `<span class="st">${esc(label)} 정상</span>` : `<span class="st bad">${esc(label)} 조회 실패</span>`;
  }).join("");
  $("#summary").innerHTML = `
    <div class="sum"><div class="k">재고 있는 매장</div><div class="big">${allHot.length}<span style="font-size:15px;font-weight:500;color:var(--muted)"> 곳</span></div></div>
    <div class="sum"><div class="k">감시 중인 카드팩 (편의점별 자동 검색)</div><div class="v">${nProducts}<span>종</span></div><div class="stat">${chainState}</div></div>`;

  $("#list").innerHTML = hot.length ? `<div class="group"><ul class="stores">${hot.map(h => `<li>
      <span class="sname"><span class="chip" style="background:var(--${h.chain});margin-right:6px">${esc(h.chainLabel)}</span><a href="${esc(h.store.mapUrl)}" target="_blank" rel="noopener">${esc(h.store.name)}</a></span>
      <span class="qty ok">${h.items.reduce((x,i)=>x+i.qty,0)}개</span>
      <span class="addr">${esc(h.store.address)}${h.store.phone ? ` · <a href="tel:${esc(h.store.phone)}" style="color:inherit">${esc(h.store.phone)}</a>` : ""}</span>
      <span class="items">${h.items.map(i => `<span class="item">${esc(i.name)}<b>${i.qty}</b></span>`).join("")}</span></li>`).join("")}</ul></div>`
    : `<div class="group"><div class="empty">지금은 재고 있는 매장이 없어요. 어떤 카드팩이든 들어오면 푸시로 알려드려요.</div></div>`;

  $("#watch").innerHTML = CHAINS.filter(c => chain === "all" || c === chain).map(c => {
    const gs = G.filter(g => g.chain === c);
    const meta = (data.chains || []).find(x => x.id === c) || {};
    const ok = gs.filter(g => !g.error && !g.pending).length;
    const stores = Math.max(0, ...gs.map(g => g.checkedStores || 0));
    const rot = meta.rotating ? ` · 우선 ${meta.priority}종 매번, 나머지 약 ${Math.round((meta.cycleRuns||1) * (data.intervalMinutes||15))}분마다` : "";
    const summ = !gs.length ? (meta.error ? "상품 검색 실패" : "카드팩 상품 없음")
      : ok ? `카드팩 ${gs.length}종 · 매장 ${stores}곳${rot}` : (gs.every(g => g.pending) ? "확인 대기 중" : "조회 실패 (외부 서비스 장애)");
    const rows = [...gs].sort((a,b) => b.stores.length - a.stores.length).map(g => `<li class="${g.error ? "bad" : ""}"><span>${esc(g.product)}</span><span>${
      g.error ? "조회 실패" : g.pending ? "확인 대기" : `재고 ${g.stores.length}곳 · ${g.checkedAt ? ago(g.checkedAt) : ""}`}</span></li>`).join("");
    const err = (!gs.length && meta.error) ? `<li class="bad"><span>${esc(meta.error)}</span><span></span></li>`
      : (gs.find(g => g.error) ? `<li class="bad"><span>${esc(gs.find(g => g.error).error)}</span><span></span></li>` : "");
    return `<details class="watch"><summary><span class="chip" style="background:var(--${c})">${esc(meta.label || c)}</span><span class="meta2">${summ}</span></summary><ul>${rows}${err}</ul></details>`;
  }).join("");

  const ev = (data.events || []).filter(e => e.region === region && (chain === "all" || e.chain === chain)).slice(0, 40);
  $("#events").innerHTML = ev.length ? ev.map(e => `<li><time>${fmt(e.at)}</time>
      <span class="${e.type === "restock" ? "in" : "out"}">${e.type === "restock" ? "입고" : "품절"}</span>
      <span>[${esc(e.chainLabel)}] ${esc(e.store)} — ${esc(e.product)} ${e.type === "restock" ? esc(e.qty) + "개" : ""}</span></li>`).join("")
    : `<li><span style="color:var(--muted)">아직 기록이 없어요.</span></li>`;
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => { chain = b.dataset.chain; save("chain", chain); render(); });
repoLinks();

const load = () => fetch("status.json?t=" + Date.now(), {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.json(); });
load().then(j => { data = j.chains ? j : DEMO; $("#demo").hidden = !!j.chains; render(); })
      .catch(() => { data = DEMO; $("#demo").hidden = false; render(); });
setInterval(() => load().then(j => { if (j.chains) { data = j; $("#demo").hidden = true; render(); } }).catch(()=>{}), 5 * 60 * 1000);
</script>
</body>
</html>
